<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | Measurements & Vectors</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/vectors/assets/images/calphy_icon.png">
  <link rel="apple-touch-icon" href="/vectors/assets/images/calphy_icon.png">
  <link rel="shortcut icon" href="/vectors/assets/images/calphy_icon.png">
  <link rel="stylesheet" href="/vectors/styles/leaderboard.css">
  <link rel="stylesheet" href="/vectors/styles/nav.css">
  <link rel="stylesheet" href="/vectors/styles/general.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <!-- SIDEBAR -->
  <div class="menubar">
    <div class="hamburger">
      <span class="material-symbols-rounded">menu</span>
    </div>
    <div class="logo-container" id="logo-container">
      <div class="logo">
        <img src="/vectors/assets/images/website_logo.png" alt="Logo picture" class="logo-pic">
        <h3>MeasureMentor</h3>
      </div>
      <div class="profile">
        <img onclick="location.href='/landing.html'" src="/vectors/assets/images/profile_placeholder.png" alt="Profile picture" class="profile-pic" id="logoButton1">
        <!-- Dropdown Modal -->
        <div id="accountDropdown1" class="dropdown-modal">
          <div class="logout-option"></div>
          <button onclick="window.open('https://calphy.gitbook.io/calphy++-docs/', '_blank')">
                        <span class="material-symbols-rounded profile-dropdown-icons">developer_guide</span>
                        Documentation
          </button>
          <button id="logoutBtn1"><span class="material-symbols-rounded profile-dropdown-icons">logout</span>Logout</button>
        </div>
      </div>
    </div>

    <div class="menu-container">
      <ul class="menu" id="menu">
          <li><a href="/vectors/dashboard.html" data-tooltip="Dashboard"><span class="material-symbols-rounded">dashboard</span></a></li>
          <li><a href="/vectors/tutorial.html" data-tooltip="Lessons"><span class="material-symbols-rounded">auto_stories</span></a></li>
          <li><a href="/vectors/simulation.html" data-tooltip="Simulator"><span class="material-symbols-rounded">arrows_output</span></a></li>
          <li><a href="/vectors/converter.html" data-tooltip="Converter"><span class="material-symbols-rounded">straighten</span></a></li>
          <li><a href="/vectors/leaderboard.html" data-tooltip="Leaderboard"><span class="material-symbols-rounded" id="this">leaderboard</span></a></li>
      </ul>
      <div class="middle"></div>
      <div class="back-container">
        <button class="nav-back-btn" aria-label="Back to main dashboard" onclick="location.href='../mainDashboard.html'">
          <span class="material-symbols-rounded door">door_front</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN BACKGROUND -->
  <div class="background">
    <div class="background-blur">
      <div class="logo-card">
        <div class="logo-main">
          <img onclick="location.href='/vectors/landing.html'" src="/vectors/assets/images/website_logo.png" alt="Logo picture" class="logo-pic-main">
          <h3>MeasureMentor</h3>
        </div>
        <div class="profile-main">
          <img src="/vectors/assets/images/profile_placeholder.png" alt="Profile picture" class="profile-pic-main" id="logoButton2">
          <!-- Dropdown Modal -->
          <div id="accountDropdown2" class="dropdown-modal">
            <div class="logout-option"></div>
            <button onclick="window.open('https://calphy.gitbook.io/calphy++-docs/', '_blank')">
                        <span class="material-symbols-rounded profile-dropdown-icons">developer_guide</span>
                        Documentation
            </button>
            <button id="logoutBtn2"><span class="material-symbols-rounded profile-dropdown-icons">logout</span>Logout</button>
          </div>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <div class="toggle-container">
          <div class="toggle">
            <button class="toggle-btn active" id="overallBtn">Overall</button>
            <button class="toggle-btn" id="measurementsBtn">Measurements</button>
            <button class="toggle-btn" id="vectorsBtn">Vectors</button>
          </div>
        </div>

        <!-- DYNAMIC LEADERBOARD -->
        <div class="leaderboard-container">
          <div id="leaderboardContent" class="leaderboard">
            <p style="text-align:center; color:#fff; opacity:0.8;">Loading leaderboard...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div id="logoutModal" class="logout-modal">
    <div class="logout-modal-content">
      <h1>Confirm Logout</h1>
      <p>Are you sure you want to log out?</p>
      <div class="logout-actions">
        <button id="cancelLogout" class="cancel-btn">Cancel</button>
        <button id="confirmLogout" class="confirm-btn">Ok</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/vectors/script/general.js"></script>
  <script type="module" src="/vectors/script/function.js"></script>
  <script src="/vectors/script/nav.js"></script>
  <script type="module" src="/vectors/script/leaderboard.js"></script>
</body>
</html>
