<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doppler Effect | Wavound</title>
  <link rel="stylesheet" href="OvSv.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">wavound</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#" class="active">Topics</a></li>
        <li><a href="#">Quiz</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
    <div class="search">&#128269;</div>
  </header>

  <main class="container">
    <h1>Doppler Effect</h1>


    <div class="animation-area">

  <!-- Car Container -->
  <div class="car-container">
    <img id="arrow-left" class="arrow" src="imgs/left.png" alt="Left Arrow">
    <img id="car" src="imgs/Car.png" alt="Car">
    <img id="arrow-right1" class="arrow" src="imgs/right.png" alt="Right Arrow">
  </div>

  <!-- People Container -->
  <div class="people-container">
    <img id="arrow-left1" class="arrow" src="imgs/left.png" alt="Left Arrow">
    <img id="people" src="imgs/standing.png" alt="People">
    <img id="arrow-right" class="arrow" src="imgs/right.png" alt="Right Arrow">
  </div>

  <!-- Static element -->
  <img id="house" src="imgs/house.svg" alt="House">

</div>

    <div class="button-group">
      <button id="startBtn">Start</button>
      <button id="reloadBtn">Reload</button>
    </div>

    <p class="desc">
      The Doppler Effect occurs when a sound-emitting source moves toward or away from an observer.
      As it approaches, the observed frequency increases; as it moves away, the frequency decreases.
    </p>
  </main>

  <script src="OvSv.js"></script>
</body>
</html>
