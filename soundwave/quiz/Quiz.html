<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Time</title>
  <link rel="stylesheet" href="Quiz.css">
</head>

<body>
  <!-- NAVBAR -->
  <div id="navbar"></div>

  <div class="background">
  <!-- 🎞️ Video Background -->
  <img src="../quiz/Images/quizbg2.gif" alt="Animated background" class="bg-gif">
  </video>

  <!-- Blur Overlay -->
  <div class="overlay"></div>

  <!-- BACK BUTTON -->
  <a href="../home/home.html" class="back-btn">← Back</a>

  <div class="background">
    <div class="overlay"></div>

    <div class="container">
      <div class="card-stack">
        <div class="card card-back-left"></div>
        <div class="card card-back-right"></div>

        <!-- 🟣 START CARD -->
        <div class="card card-front start-card">
          <h1>QUIZ TIME</h1>
          <input id="username" type="text" placeholder="Enter your name">
          <button id="startBtn" class="start-btn">Start</button>
        </div>

        <!-- 🧩 QUIZ CARD -->
        <div class="card card-front quiz-card" aria-live="polite">
          <div class="quiz-inner">

            <div class="quiz-top">
              <div class="question-wrap">
                <div id="questionText" class="question">Question will appear here</div>
              </div>
            </div>

            <div class="quiz-middle">
              <div id="optionsContainer" class="options">
                <!-- Option buttons inserted dynamically -->
              </div>
            </div>

            <div class="quiz-bottom">
              <div class="controls">
                <button id="prevBtn" class="control-btn">Previous</button>
                <div id="progressText" class="progress">1 / 30</div>
                <button id="nextBtn" class="control-btn">Next</button>
              </div>
              <div style="display:flex;justify-content:center;margin-top:8px;">
                <button id="giveUpBtn" class="control-btn give-up-btn">Give Up</button>
              </div>
            </div>

          </div> <!-- .quiz-inner -->
        </div> <!-- .quiz-card -->

      </div> <!-- .card-stack -->
    </div> <!-- .container -->
  </div> <!-- .background -->

  <script src="Quiz.js"></script>

  <!-- NAVBAR LOADER -->
  <script>
    // Load navbar dynamically
    fetch('../nav-bar/nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
        const script = document.createElement('script');
        script.src = '../nav-bar/nav.js';
        document.body.appendChild(script);
      });
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '../nav-bar/nav.css';
    document.head.appendChild(link);
  </script>
</body>
</html>
