<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Simulator</title>
  <link rel="stylesheet" href="wave-simulator.css" />
  <link rel="stylesheet" href="waves-bg.css" />

</head>
<body>
  <!-- Navbar -->
  <div id="navbar"></div>
  <!-- 🌊 Load shared background video -->

  <script>
  fetch('waves-bg.html')
    .then(res => res.text())
    .then(data => {
      document.body.insertAdjacentHTML('afterbegin', data);
    });
  </script>

  <!-- BACK BUTTON -->
  <a href="waves.html" class="back-btn">← Back</a>

  <main>
    <section class="simulator">
      <h1 class="gradient-title">WAVE SIMULATOR</h1>

      <!-- Wave Display -->
      <div class="wave-display">
        <canvas id="waveCanvas"></canvas>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="control">
          <label for="amplitude">Amplitude:</label>
          <div class="slider-box">
          <input type="range" id="amplitudeSlider" min="1" max="500" value="50">
          <input type="number" id="amplitudeInput" min="1" max="500" value="50">
            <span>m</span>
          </div>
        </div>

        <div class="control">
          <label for="frequency">Frequency:</label>
          <div class="slider-box">
          <input type="range" id="frequencySlider" min="1" max="500" value="5">
          <input type="number" id="frequencyInput" min="1" max="500" value="5">
            <span>Hz</span>
          </div>
        </div>

        <div class="control">
          <label for="speed">Speed:</label>
          <div class="slider-box">
          <input type="range" id="speedSlider" min="1" max="500" value="100">
          <input type="number" id="speedInput" min="1" max="500" value="100">
            <span>m/s</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Load Navbar -->
  <script>
    fetch('../nav-bar/nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
        const script = document.createElement('script');
        script.src = '../nav-bar/nav.js';
        document.body.appendChild(script);
      });

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '../nav-bar/nav.css';
    document.head.appendChild(link);
  </script>

  <script src="wave-simulator.js"></script>
  
</body>
</html>
