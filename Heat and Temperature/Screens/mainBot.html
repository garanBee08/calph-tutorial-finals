<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <audio src="/Heat and Temperature/Musics/roboMusic.mp3" autoplay loop></audio>
    <nav class="navbar">

        <div class="middle"></div>
        <div class="right">
            <ul>
                <li class="items"><a href="/Heat and Temperature/Screens/dashboard.html"><span class="material-symbols-outlined">home</span></a></li>
                <li class="items"><a href="/Heat and Temperature/Screens/mainContent.html"><span class="material-symbols-outlined">lightbulb_2</span></a></li>

        <div class="questions">

                    <a class = ".aheight" href ="/Heat and Temperature/Screens/quizSet1.html">

                </div>
                <div class="question2">

                    </a>
                    <a class = ".aheight" href = "">
                        <div class="score2">
                            <p id="scoreIdentification">Score: 8/10</p>
                        </div>
                    </a>
                </div>
            </div>
            <div class="leaderB">

                </a>
            </div>

        <div class="roboPapa">
